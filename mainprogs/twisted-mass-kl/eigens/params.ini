# ---------------------------------------------------------------------
# Extremal eigenvalues of Q_h^2, the square of the Hermitean
# non-degenerate twisted mass doublet operator.
# ---------------------------------------------------------------------

# Lattice geometry, (Lt, Lz, Ly, Lx)
Dimensions = 48 24 24 24;

Random seed = 99523696;

# ---------------------------------------------------------------------
# Gauge configuration
# ---------------------------------------------------------------------
# Quenched (Nf = 0) Wilson gauge action ensemble at beta = 6.20, 24^3 x 48,
# a^-1 = 2.964 GeV, i.e. a = 0.0665742 fm. Duerr & Koutsou,
# PRD 83 (2011) 114512 [arXiv:1012.3615], Table I.
#
# These configurations already carry the single APE smearing step
# (alpha = 0.72) that the kappa_c values below assume, so no further
# smearing is applied here. Do not set "APE iterations" to anything but 0
# with these configurations.
Conf = file;
Conf format = raw_32;
Conf file = /p/project1/cslnpp/gregoriou1/Nf0_b6p20_L24T48-APE/conf_Nf0_b6p20_L24T48_apeN1a0p72.0024200;

APE iterations = 0;
APE alpha = 0.72;

# ---------------------------------------------------------------------
# Dirac operator
# ---------------------------------------------------------------------
# Brillouin is the cheaper choice for development: its lambda_max is about
# 6 rather than about 56, so the condition number of Q_h^2 is roughly an
# order of magnitude smaller and the Lanczos needs about 3x fewer
# iterations. Production runs should use Standard, since the ETMC action
# this study is about is standard Wilson-clover.
Dslash operator = Brillouin;

# Required in order to match the Brillouin kappa_c below: the operator of
# arXiv:1012.3615 sums over all shortest paths and back-projects the
# diagonal links to SU(3) (Sec. V A of that paper).
Project diagonal links = yes;

# kappa_c at beta = 6.20 with c_sw = 1 and one APE step, taken from the
# fitted column of Table I (the paper states the interpolated values are
# more accurate than the direct measurements):
#
#   Brillouin  kappa_c = 0.126676   ->  m_0 = 1/(2 kappa) - 4 = -0.052923
#   Standard   kappa_c = 0.129303   ->  m_0 = 1/(2 kappa) - 4 = -0.133115
#
# Switching "Dslash operator" without also switching kappa puts the run
# off maximal twist and invalidates the whole measurement.
kappa = 0.126676;
c_sw = 1;

# ---------------------------------------------------------------------
# Twisted masses
# ---------------------------------------------------------------------
# The two members of the doublet are given by their own bare twisted
# masses in lattice units; the program derives
#
#   mubar  = (mu_heavy + mu_light)/2 ,  epsbar = (mu_heavy - mu_light)/2 .
#
# They are specified this way round on purpose. For the (u,c) doublet
# epsbar/mubar = 0.9962, so mu_light = mubar - epsbar is a catastrophic
# cancellation: quoting mubar and epsbar to any finite number of digits
# would corrupt exactly the quantity this program exists to measure.
#
# Values from ETMC, arXiv:2501.19350, ensemble B64: Table 1 for the isoQCD
# bare masses, Table 2 for the QED and strong-isospin-breaking shifts.
#
#   a*mu_u = 4.444e-4          a*mu_d = 9.564e-4
#   a*mu_s = 1.82054e-2        a*mu_c = 2.353370e-1
#
# Equal-charge doublets, which are the ones a dynamical QCD+QED
# simulation would have to use:
#
#   (u,c)   mu_light = 4.444e-4    mu_heavy = 0.2353370
#           predicted lambda_min = mu_light^2 = 1.974914e-07
#   (d,s)   mu_light = 9.564e-4    mu_heavy = 0.0182054
#           predicted lambda_min = mu_light^2 = 9.147010e-07
#
# isoQCD reference doublet, the one actually simulated in those ensembles:
#
#   (s,c)   mu_light = 0.01825     mu_heavy = 0.2377
#           predicted lambda_min = mu_light^2 = 3.330625e-04
#
# Note that these are ETMC's a*mu at a = 0.0795 fm, whereas this ensemble
# is at a = 0.0666 fm, so the same numbers correspond to a heavier
# physical quark mass here. That is fine for validating the code, but the
# resulting lambda_min is not a prediction for the ETMC ensembles.
mu_light = 4.444e-4;
mu_heavy = 0.2353370;

# ---------------------------------------------------------------------
# Lanczos
# ---------------------------------------------------------------------
# Convergence is on the relative change of lambda_min between two
# successive diagonalisations of the tridiagonal matrix.
Lanczos epsilon = 1e-4;
Lanczos max iters = 5000;

# Number of Lanczos iterations between diagonalisations of the
# tridiagonal matrix. Each diagonalisation costs O(n^3) time and O(n^2)
# memory at the current Lanczos dimension n (n = 5000 is a 200 MB dense
# matrix), so at the iteration counts this operator needs it must not be
# done at every step. Set to 1 to recover the behaviour of
# mainprogs/eigens.
Diagonalization frequency = 100;

# ---------------------------------------------------------------------
# Free field check
# ---------------------------------------------------------------------
# Set Conf = unit, c_sw = 0, kappa = 0.125 and any mu_heavy > mu_light > 0.
# lambda_min must then come out equal to mu_light^2 to machine precision,
# because the free eigenvalues are
#
#   lambda(p,-) = sum_mu sin^2(p_mu)
#                 + ( sqrt(mubar^2 + M(p)^2) - epsbar )^2 ,
#   M(p) = m_0 + sum_mu ( 1 - cos(p_mu) ) ,
#
# which at m_0 = 0 is minimised at p = 0 and equals (mubar - epsbar)^2.
# This validates the operator, the normalisation and the flavour structure
# on any lattice size, without a gauge configuration.
